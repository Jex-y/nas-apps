name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/jex-y/nas-apps
  NAS_HOST: nas.tail12605.ts.net
  NAS_KNOWN_HOST: nas.tail12605.ts.net ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAWAEJgoYhvxInk8JEcCpfBeXtxgmsqInnv0nzFoXzZk

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apps_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d apps_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Migrations match the schema
        run: bun run db:check
      - run: bun test
      - run: bun run build
      - name: Deploy stack is valid
        env:
          APP_TAG: ${{ github.sha }}
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          docker compose -f deploy/stack/compose.yaml config --quiet

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over SSH
        env:
          NAS_DEPLOY_KEY: ${{ secrets.NAS_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          printf '%s\n' "$NAS_DEPLOY_KEY" > ~/.ssh/deploy
          printf '%s\n' "$NAS_KNOWN_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "ed@$NAS_HOST" "$GITHUB_SHA" < /dev/null
