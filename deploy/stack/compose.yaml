# Deployed to /volume1/Ed/app on the NAS by CI. Secrets come from the .env beside it there.
name: nas-apps

x-database-env: &database-env
  PGHOST: postgres
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:?}
  PGPASSWORD: ${POSTGRES_PASSWORD:?}
  PGDATABASE: apps

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: apps
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /volume1/docker/postgres18:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *database-env
    # Loopback only: identity comes from headers that only `tailscale serve` can be trusted to set.
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  migrate:
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *database-env
    command: ["bun", "migrate.js"]
