# Baked into the image at /stack and run from /volume1/Ed/app/releases/<sha>/ on the NAS by deploy/nas-deploy.sh.
# Secrets come from the NAS's /volume1/Ed/app/.env, symlinked into each release. Postgres and Garage keep
# their data under /volume1/Ed/app/data, which the deploy script creates, so Hyper Backup covers it with the share.
# Config files are mounted from /volume1/Ed/app/config, where the deploy script copies each release's: a mount from
# the release directory would change path every deploy, making Compose recreate tailscale and so the whole stack
# that shares its network, and would break once that release is pruned. Their hashes, as labels, recreate a service
# only when its config really changes.
name: nas-apps

x-runtime-env: &runtime-env
  PUBLIC_URL: https://apps.tail12605.ts.net

x-database-env: &database-env
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:?}
  PGPASSWORD: ${POSTGRES_PASSWORD:?}
  PGDATABASE: apps

x-blob-env: &blob-env
  S3_ENDPOINT: http://127.0.0.1:3900
  S3_PUBLIC_ENDPOINT: https://apps.tail12605.ts.net:3900
  S3_REGION: garage
  S3_BUCKET: apps
  S3_ACCESS_KEY_ID: ${GARAGE_DEFAULT_ACCESS_KEY:?}
  S3_SECRET_ACCESS_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}

# Web Push VAPID keys; generate a pair once with `bunx web-push generate-vapid-keys`.
x-notify-env: &notify-env
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?}
  VAPID_SUBJECT: ${VAPID_SUBJECT:?}

# Optional per-app secrets: an unset one reaches the app as an empty string, which the app reads as unset.
x-app-secrets-env: &app-secrets-env
  TFL_API_KEY: ${TFL_API_KEY:-}

x-tailnet: &tailnet
  network_mode: service:tailscale
  depends_on:
    tailscale:
      condition: service_healthy

services:
  # The stack's only way in. Every other service shares its network namespace and publish no host ports,
  # so Tailscale-User-Login can only have been set by tailscale serve.
  tailscale:
    image: tailscale/tailscale:v1.102.4
    hostname: apps
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:apps
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /stack/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    labels:
      nas-apps.config-sha256: ${SERVE_CONFIG_SHA256:?}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /volume1/Ed/app/config/serve.json:/stack/serve.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  postgres:
    <<: *tailnet
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: apps
    volumes:
      - /volume1/Ed/app/data/postgres:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FROM scratch: no shell for a healthcheck, so dependants only wait for it to start.
  garage:
    <<: *tailnet
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: apps
    labels:
      nas-apps.config-sha256: ${GARAGE_CONFIG_SHA256:?}
    volumes:
      - /volume1/Ed/app/config/garage.toml:/etc/garage.toml:ro
      - /volume1/Ed/app/data/garage:/var/lib/garage

  server:
    <<: *tailnet
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    restart: unless-stopped
    depends_on:
      tailscale:
        condition: service_healthy
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      <<: [*runtime-env, *database-env, *blob-env, *notify-env, *app-secrets-env]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *tailnet
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    restart: unless-stopped
    command: ["bun", "worker.js"]
    depends_on:
      tailscale:
        condition: service_healthy
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      <<: [*runtime-env, *database-env, *blob-env, *notify-env, *app-secrets-env]
    mem_limit: 192m
    # Long enough for in-flight jobs to finish; job timeouts stay under a minute by default.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  migrate:
    <<: *tailnet
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *database-env
    command: ["bun", "migrate.js"]

volumes:
  tailscale-state:
