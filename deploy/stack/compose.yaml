# Baked into the image at /stack and run from /volume1/Ed/app/releases/<sha>/ on the NAS by deploy/nas-deploy.sh.
# Secrets come from the NAS's /volume1/Ed/app/.env, symlinked into each release. Postgres, Garage and ntfy keep
# their data under /volume1/Ed/app/data, which the deploy script creates, so Hyper Backup covers it with the share.
name: nas-apps

x-runtime-env: &runtime-env
  PUBLIC_URL: https://apps.tail12605.ts.net

x-database-env: &database-env
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGUSER: ${POSTGRES_USER:?}
  PGPASSWORD: ${POSTGRES_PASSWORD:?}
  PGDATABASE: apps

x-blob-env: &blob-env
  S3_ENDPOINT: http://127.0.0.1:3900
  S3_PUBLIC_ENDPOINT: https://apps.tail12605.ts.net:3900
  S3_REGION: garage
  S3_BUCKET: apps
  S3_ACCESS_KEY_ID: ${GARAGE_DEFAULT_ACCESS_KEY:?}
  S3_SECRET_ACCESS_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}

x-notify-env: &notify-env
  NTFY_URL: http://127.0.0.1:2586
  NTFY_TOKEN: ${NTFY_TOKEN:?}

# Optional per-app secrets: an unset one reaches the app as an empty string, which the app reads as unset.
x-app-secrets-env: &app-secrets-env
  TFL_API_KEY: ${TFL_API_KEY:-}

x-tailnet: &tailnet
  network_mode: service:tailscale
  depends_on:
    tailscale:
      condition: service_healthy

services:
  # The stack's only way in. Every other service shares its network namespace and publish no host ports,
  # so Tailscale-User-Login can only have been set by tailscale serve.
  tailscale:
    image: tailscale/tailscale:v1.102.4
    hostname: apps
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_EXTRA_ARGS: --advertise-tags=tag:apps
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /stack/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve.json:/stack/serve.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9002/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  postgres:
    <<: *tailnet
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: apps
    volumes:
      - /volume1/Ed/app/data/postgres:/var/lib/postgresql
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FROM scratch: no shell for a healthcheck, so dependants only wait for it to start.
  garage:
    <<: *tailnet
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?}
      GARAGE_DEFAULT_BUCKET: apps
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - /volume1/Ed/app/data/garage:/var/lib/garage

  server:
    <<: *tailnet
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    restart: unless-stopped
    depends_on:
      tailscale:
        condition: service_healthy
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
    environment:
      <<: [*runtime-env, *database-env, *blob-env, *notify-env, *app-secrets-env]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *tailnet
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    restart: unless-stopped
    command: ["bun", "worker.js"]
    depends_on:
      tailscale:
        condition: service_healthy
      postgres:
        condition: service_healthy
      garage:
        condition: service_started
      ntfy:
        condition: service_healthy
    environment:
      <<: [*runtime-env, *database-env, *blob-env, *notify-env, *app-secrets-env]
    mem_limit: 192m
    # Long enough for in-flight jobs to finish; job timeouts stay under a minute by default.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Push notifications, published to the tailnet on :8443. iOS delivery goes through ntfy.sh's upstream relay,
  # which only ever sees a hash of the topic and the message ID, never the content.
  ntfy:
    <<: *tailnet
    image: binwiederhier/ntfy:v2.28.0
    restart: unless-stopped
    command: ["serve"]
    environment:
      NTFY_BASE_URL: https://apps.tail12605.ts.net:8443
      NTFY_LISTEN_HTTP: 127.0.0.1:2586
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      NTFY_AUTH_USERS: ${NTFY_AUTH_USERS:?}
      NTFY_AUTH_TOKENS: ed:${NTFY_TOKEN:?}:worker
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
    volumes:
      - /volume1/Ed/app/data/ntfy:/var/lib/ntfy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2586/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  migrate:
    <<: *tailnet
    image: ghcr.io/jex-y/nas-apps:${APP_TAG:?}
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *database-env
    command: ["bun", "migrate.js"]

volumes:
  tailscale-state:
