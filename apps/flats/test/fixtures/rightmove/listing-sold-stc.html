/>\\u003Cbr />There is private parking space at the rear of the property.\\u003Cbr />\\u003Cbr />\\u003Cb>Loving The Location\\u003C/b> - \\u003Cbr />\\u003Cbr />Hackney Wick lies between Victoria Park and the River Lee. Once a bustling industrial area, its green spaces and easy access to the best of east London it has drawn an eclectic and creative crowd. Since the 2012 Olympics, it has seen a significant influx of cultural investment, with new developments and facilities in easy reach of this house. There are numerous restaurants and bars, including the Michelin-starred Cornerstone, as well as Silo and Crate Brewery.\\u003Cbr />\\u003Cbr />The Here East campus, The Breakfast Club, Randy’s Wings, Mother and Gotto is a short walk away and operates as a co-working hub and cultural centre, while award-winning theatre and music venue The Yard is also close by.\\u003Cbr />\\u003Cbr />The amenities of the Olympic Park are close at hand, where the East Bank, a new world-class cultural quarter, is now under construction, with new facilities for the V&A Museum, Sadler’s Wells Theatre, the BBC and the London College of Fashion, as well as a new campus for UCL.\\u003Cbr />\\u003Cbr />Victoria Park is a short walk away and is surrounded by a number of amazing pubs. On the north side of the park is Victoria Park Village, with its excellent range of restaurants and shops, including The Ginger Pig butchers, Bottle Apostle and Jonathan Norris Fishmongers.\\u003Cbr />\\u003Cbr />The house is a seven-minute walk from Hackney Wick station, which runs London Overground services to Highbury & Islington in around 10 minutes and Stratford International in approximately six minutes. The area is also well served by bus routes into town.\\u003Cbr />\\u003Cbr />Leasehold\\u003Cbr />Lease: 105 Years \\u003Cbr />Service Charge: £1400 p/a \\u003Cbr />Ground Rent: £100 p/a\\u003Cbr />Council Tax: Band C\\u003Cbr />\\u003Cbr />\",\"2 bedroom apartment\",\"\\u003Cb>Disclaimer\\u003C/b> - Property
